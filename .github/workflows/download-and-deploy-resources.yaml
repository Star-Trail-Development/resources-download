name: Download and Deploy Resources to Private Server

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: deploy-resources
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # 允许 GITHUB_TOKEN 将修复后的文件推送回仓库

    steps:
      # 1. 检出代码（内含 pack.toml 等）
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # 2. 设置 Java（packwiz-installer 需要 Java）
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'   # 版本根据需要调整，通常 8/17/21 都可以

      # 3. 修复元数据（side 统一为 both）并刷新 packwiz 索引
      - name: Fix metadata and refresh index
        run: |
          chmod +x packwiz
          bash fix-metadata.sh
          ./packwiz refresh

      # 4. 将有变更的文件提交并推送回仓库（仅在存在变更时）
      # 注意：使用 GITHUB_TOKEN 推送不会再次触发本工作流
      - name: Commit and push changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: fix metadata and refresh packwiz index"
          git push

      # 5. 下载并运行 packwiz-installer
      - name: Download packwiz-installer and run it
        run: |
          curl --fail --show-error --silent --location \
            --retry 3 --retry-delay 2 --retry-connrefused \
            --output packwiz-installer-bootstrap.jar \
            https://github.com/packwiz/packwiz-installer-bootstrap/releases/latest/download/packwiz-installer-bootstrap.jar
          java -jar packwiz-installer-bootstrap.jar -g pack.toml

          # 6. 比较哈希后上传资源到 FileHub，保留原有目录结构
      - name: Upload downloaded resources to FileHub
        env:
          FILEHUB_URL: ${{ secrets.FILEHUB_URL }}
          FILEHUB_TOKEN: ${{ secrets.FILEHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$FILEHUB_URL" || -z "$FILEHUB_TOKEN" ]]; then
            echo "FILEHUB_URL and FILEHUB_TOKEN must be configured as repository secrets" >&2
            exit 1
          fi

          if [[ "$FILEHUB_URL" != https://* ]]; then
            echo "FILEHUB_URL must use HTTPS" >&2
            exit 1
          fi

          filehub_url="${FILEHUB_URL%/}"
          resource_dirs=()
          for dir in mods resourcepacks shaderpacks; do
            [[ -d "$dir" ]] && resource_dirs+=("$dir")
          done

          if (( ${#resource_dirs[@]} == 0 )); then
            echo "No resource directories were found" >&2
            exit 1
          fi

          mapfile -d '' resource_files < <(
            find "${resource_dirs[@]}" -type f ! -name '*.pw.toml' -print0 | sort -z
          )

          if (( ${#resource_files[@]} == 0 )); then
            echo "Packwiz did not download any resource files" >&2
            exit 1
          fi

          # 上传前读取远端清单：已有完整路径的文件直接跳过，避免重复覆盖。
          index_json="$(curl --fail-with-body --show-error --silent \
            --proto '=https' --tlsv1.2 \
            --retry 3 --retry-delay 2 --retry-connrefused \
            "${filehub_url}/index.json")"

          if ! jq -e '
            ((.files | type) == "array")
            and all(.files[];
              ((.path | type) == "string")
              and ((.sha256 | type) == "string")
            )
          ' >/dev/null <<<"$index_json"; then
            echo "FileHub returned an invalid file index" >&2
            exit 1
          fi

          managed_prefixes=(
            "mods/"
            "resourcepacks/"
            "shaderpacks/"
          )
          mapfile -t remote_resource_entries < <(
            jq -r \
              --arg mods_prefix "${managed_prefixes[0]}" \
              --arg resourcepacks_prefix "${managed_prefixes[1]}" \
              --arg shaderpacks_prefix "${managed_prefixes[2]}" '
              .files[]
              | select(
                  (.path | startswith($mods_prefix))
                  or (.path | startswith($resourcepacks_prefix))
                  or (.path | startswith($shaderpacks_prefix))
                )
              | "\(.path)\t\(.sha256)"
            ' <<<"$index_json"
          )

          remote_resource_paths=()
          declare -A remote_resource_sha256=()
          for entry in "${remote_resource_entries[@]}"; do
            IFS=$'\t' read -r remote_path remote_sha256 <<<"$entry"
            remote_resource_paths+=("$remote_path")
            remote_resource_sha256["$remote_path"]="$remote_sha256"
          done

          declare -A remote_resource_path_set=()
          for remote_path in "${remote_resource_paths[@]}"; do
            remote_resource_path_set["$remote_path"]=1
          done

          # 通过当前元数据文件和父提交中的 filename，记录改名时的旧路径。
          declare -A previous_resource_path=()
          for dir in "${resource_dirs[@]}"; do
            while IFS= read -r -d '' metadata_file; do
              current_filename="$(sed -nE "s/^[[:space:]]*filename[[:space:]]*=[[:space:]]*(['\"])(.*)\1[[:space:]]*$/\2/p" "$metadata_file" | head -n 1)"
              old_filename="$(git show "HEAD^:$metadata_file" 2>/dev/null | sed -nE "s/^[[:space:]]*filename[[:space:]]*=[[:space:]]*(['\"])(.*)\1[[:space:]]*$/\2/p" | head -n 1 || true)"
              if [[ -n "$current_filename" && -n "$old_filename" ]]; then
                current_path="$dir/$current_filename"
                old_path="$dir/$old_filename"
                if [[ "$current_path" != "$old_path" && ${remote_resource_path_set["$old_path"]+_} ]]; then
                  previous_resource_path["$current_path"]="$old_path"
                fi
              fi
            done < <(find "$dir" -maxdepth 1 -type f -name '*.pw.toml' -print0)
          done

          current_resource_paths=()
          uploaded_count=0
          overwritten_count=0
          skipped_count=0
          for local_file in "${resource_files[@]}"; do
            remote_path="$local_file"
            encoded_path="$(python3 -c 'import sys, urllib.parse; print("/".join(urllib.parse.quote(part, safe="") for part in sys.argv[1].split("/")))' "$remote_path")"
            local_sha256="$(sha256sum "$local_file" | cut -d ' ' -f 1)"
            current_resource_paths+=("$remote_path")

            old_path="${previous_resource_path["$remote_path"]:-$remote_path}"
            existing_sha256="${remote_resource_sha256["$remote_path"]-}"
            if [[ -n "$existing_sha256" && "$existing_sha256" == "$local_sha256" ]]; then
              echo "Skipping unchanged resource: $old_path (sha256=$existing_sha256) -> $remote_path (sha256=$local_sha256)"
              ((skipped_count += 1))
              continue
            fi

            if [[ ${remote_resource_path_set["$remote_path"]+_} ]]; then
              echo "Overwriting updated resource: $old_path (sha256=$existing_sha256) -> $remote_path (sha256=$local_sha256)"
              ((overwritten_count += 1))
            else
              previous_sha256="${remote_resource_sha256["$old_path"]-}"
              if [[ -n "$previous_sha256" ]]; then
                old_resource="${old_path} (sha256=${previous_sha256})"
              else
                old_resource="${old_path}"
              fi
              echo "Uploading new resource: $old_resource -> $remote_path (sha256=$local_sha256)"
            fi
            response="$(curl --fail-with-body --show-error --silent \
              --proto '=https' --tlsv1.2 \
              --retry 3 --retry-delay 2 --retry-connrefused \
              --request PUT \
              --header "Authorization: Bearer ${FILEHUB_TOKEN}" \
              --header 'Content-Type: application/octet-stream' \
              --data-binary "@${local_file}" \
              "${filehub_url}/api/files/${encoded_path}")"

            remote_sha256="$(jq -er '.sha256' <<<"$response")"
            if [[ "$remote_sha256" != "$local_sha256" ]]; then
              echo "SHA256 mismatch after uploading $local_file" >&2
              exit 1
            fi
            ((uploaded_count += 1))
          done

          echo "Uploaded $uploaded_count new resource file(s), overwrote $overwritten_count updated file(s), skipped $skipped_count unchanged file(s)"

          # 上传全部成功后，将三个远端资源目录同步为当前清单，清理旧版本文件。
          if (( ${#current_resource_paths[@]} == 0 )); then
            echo "No local resource files were found; refusing to clean remote directories" >&2
            exit 1
          fi

          deleted_count=0
          for remote_path in "${remote_resource_paths[@]}"; do
            keep_file=false
            for current_path in "${current_resource_paths[@]}"; do
              if [[ "$remote_path" == "$current_path" ]]; then
                keep_file=true
                break
              fi
            done

            if [[ "$keep_file" == true ]]; then
              continue
            fi

            managed_path=false
            for managed_prefix in "${managed_prefixes[@]}"; do
              if [[ "$remote_path" == "$managed_prefix"* ]]; then
                managed_path=true
                break
              fi
            done
            if [[ "$managed_path" != true ]]; then
              echo "Refusing to delete path outside managed resource directories: $remote_path" >&2
              exit 1
            fi

            encoded_path="$(python3 -c 'import sys, urllib.parse; print("/".join(urllib.parse.quote(part, safe="") for part in sys.argv[1].split("/")))' "$remote_path")"
            echo "Deleting obsolete resource file: $remote_path"
            response="$(curl --fail-with-body --show-error --silent \
              --proto '=https' --tlsv1.2 \
              --retry 3 --retry-delay 2 --retry-connrefused \
              --request DELETE \
              --header "Authorization: Bearer ${FILEHUB_TOKEN}" \
              "${filehub_url}/api/files/${encoded_path}")"

            jq -e '.success == true' >/dev/null <<<"$response"
            ((deleted_count += 1))
          done

          echo "Deleted $deleted_count obsolete resource file(s)"
